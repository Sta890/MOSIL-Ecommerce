<div class="group flex flex-col bg-white transition-transform duration-300 hover:-translate-y-1">
  <!-- Image -->
  <a [routerLink]="['/products', product.id]" class="block relative overflow-hidden bg-ink-50"
     style="aspect-ratio:3/4">
    <img [src]="getSelectedImage()" [alt]="product.name"
         class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
         loading="lazy">
    <!-- Badges -->
    <div class="absolute top-3 left-3 flex flex-col gap-1">
      <span *ngIf="product.isNew" class="badge-new">NEW</span>
      <span *ngIf="product.isSale" class="badge-sale">SALE</span>
    </div>
    <!-- Quick Add -->
    <div
      class="absolute bottom-0 left-0 right-0 p-3 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
      <button (click)="quickAdd($event)"
              class="w-full py-3 bg-ink text-white text-xs font-bold tracking-widest uppercase transition-colors hover:bg-gold hover:text-ink">
        {{ added ? '✓ Added!' : 'Quick Add' }}
      </button>
    </div>
    <!-- Cart indicator -->
    <div *ngIf="cartService.isInCart(product.id)"
         class="absolute top-3 right-3 w-5 h-5 bg-gold rounded-full flex items-center justify-center">
      <span class="text-ink text-[10px] font-black">✓</span>
    </div>
  </a>

  <!-- Info -->
  <div class="pt-3 pb-4 px-1">
    <div class="flex justify-between items-center mb-1">
      <span class="text-[10px] font-black tracking-[0.2em] uppercase text-ink-500">{{ product.brand }}</span>
      <div class="flex items-center gap-1 text-xs text-ink-700">
        <span class="text-gold">★</span>
        <span class="font-semibold">{{ product.rating }}</span>
        <span class="text-ink-400">({{ product.reviewCount }})</span>
      </div>
    </div>
    <a [routerLink]="['/products', product.id]"
       class="block text-sm font-semibold text-ink truncate mb-2 hover:text-gold transition-colors no-underline">
      {{ product.name }}
    </a>
    <div class="flex items-center gap-2 mb-3">
      <span class="font-black text-base text-ink">{{ product.price | currency :'XOF':'symbol':'1.0-0' }}</span>
      <span *ngIf="product.originalPrice"
            class="text-sm text-ink-400 line-through">{{ product.originalPrice | currency :'XOF':'symbol':'1.0-0' }}</span>
      <span *ngIf="product.originalPrice" class="text-xs font-bold text-red-500">-{{ getDiscount() }}%</span>
    </div>
    <div class="flex items-center gap-1.5">
         <span *ngFor="let color of getColors().slice(0,4); let i = index"
               class="w-4 h-4 rounded-full border inline-block cursor-pointer transition-all"
               [class.border-ink]="selectedColorIndex() === i"
               [class.scale-125]="selectedColorIndex() === i"
               [title]="color"
               [style.background]="getColorHex(color)"
               [style.borderColor]="selectedColorIndex() === i ? '#111' : 'rgba(0,0,0,0.1)'"
               (click)="selectedColorIndex.set(i)">
        </span>
      <span *ngIf="getColors().length > 4"
            class="text-[11px] text-ink-500 ml-1">+{{ product.colors.length - 4 }}</span>
    </div>
  </div>
</div>
