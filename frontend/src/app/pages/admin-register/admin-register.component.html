<div class="min-h-screen bg-ink flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-10">
      <h1 class="font-serif text-4xl font-black text-white mb-2">
        MOSIL-<span class="text-gold">SHOP</span>
      </h1>
      <p class="text-ink-400 text-sm tracking-widest uppercase">Administration</p>
    </div>

    <!-- Card -->
    <div class="bg-white p-8">
      <h2 class="font-serif text-2xl font-black text-ink mb-2">Créer un Admin</h2>
      <p class="text-ink-400 text-sm mb-8">Réservé aux Super Administrateurs</p>

      <!-- Error -->
      <div *ngIf="error()" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 mb-4 text-sm">
        ✗ {{ error() }}
      </div>

      <!-- Success -->
      <div *ngIf="success()" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 mb-4 text-sm">
        ✓ {{ success() }}
      </div>

      <!-- Form -->
      <div class="flex flex-col gap-4">
        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-black tracking-widest uppercase text-ink-600">Prénom *</label>
            <input type="text" [(ngModel)]="registerData.firstName"
                   placeholder="John"
                   class="px-4 py-3 border border-ink-200 text-sm outline-none focus:border-gold transition-colors">
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-black tracking-widest uppercase text-ink-600">Nom *</label>
            <input type="text" [(ngModel)]="registerData.lastName"
                   placeholder="Doe"
                   class="px-4 py-3 border border-ink-200 text-sm outline-none focus:border-gold transition-colors">
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black tracking-widest uppercase text-ink-600">Email *</label>
          <input type="email" [(ngModel)]="registerData.email"
                 placeholder="admin@example.com"
                 class="px-4 py-3 border border-ink-200 text-sm outline-none focus:border-gold transition-colors">
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black tracking-widest uppercase text-ink-600">Téléphone</label>
          <input type="text" [(ngModel)]="registerData.phone"
                 placeholder="+237 6XX XXX XXX"
                 class="px-4 py-3 border border-ink-200 text-sm outline-none focus:border-gold transition-colors">
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black tracking-widest uppercase text-ink-600">Mot de passe *</label>
          <input type="password" [(ngModel)]="registerData.password"
                 placeholder="••••••••"
                 class="px-4 py-3 border border-ink-200 text-sm outline-none focus:border-gold transition-colors">
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black tracking-widest uppercase text-ink-600">Rôle</label>
          <select [(ngModel)]="registerData.role"
                  class="px-4 py-3 border border-ink-200 text-sm outline-none focus:border-gold bg-white">
            <option value="ADMIN">ADMIN</option>
            <option value="SUPER_ADMIN">SUPER ADMIN</option>
          </select>
        </div>
        <button (click)="register()" [disabled]="loading()"
                class="w-full py-3 bg-gold text-ink font-black text-sm tracking-widest uppercase hover:bg-ink hover:text-white transition-colors mt-2">
          {{ loading() ? 'Création...' : 'Créer le compte' }}
        </button>
      </div>

      <!-- Links -->
      <div class="flex justify-between mt-6">
        <a routerLink="/admin-login" class="text-xs text-ink-400 hover:text-ink transition-colors no-underline">
          ← Retour au login
        </a>
        <a routerLink="/" class="text-xs text-ink-400 hover:text-ink transition-colors no-underline">
          Retour à la boutique
        </a>
      </div>
    </div>

  </div>
</div>
