<div class="min-h-screen bg-ink flex items-center justify-center px-6 py-16">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-10">
      <a routerLink="/" class="font-serif text-4xl font-black text-white no-underline">
        MOSIL-<span class="text-gold">SHOP</span>
      </a>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-ink-700 mb-8">
      <button (click)="mode.set('login')"
              class="flex-1 py-3 text-sm font-bold tracking-widest uppercase border-b-2 -mb-px transition-all"
              [class]="mode() === 'login' ? 'border-gold text-white' : 'border-transparent text-ink-500'">
        Login
      </button>
      <button (click)="mode.set('register')"
              class="flex-1 py-3 text-sm font-bold tracking-widest uppercase border-b-2 -mb-px transition-all"
              [class]="mode() === 'register' ? 'border-gold text-white' : 'border-transparent text-ink-500'">
        Register
      </button>
    </div>

    <!-- Error -->
    <div *ngIf="error()" class="bg-red-900/30 border border-red-500 text-red-400 text-sm px-4 py-3 mb-6">
      {{ error() }}
    </div>

    <!-- LOGIN FORM -->
    <form *ngIf="mode() === 'login'" (ngSubmit)="login()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-black tracking-widest uppercase text-ink-400">Email</label>
        <input type="email" [(ngModel)]="loginData.email" name="email" required
               placeholder="john@example.com"
               class="bg-ink-800 border border-ink-700 text-white placeholder-ink-500 px-4 py-3 text-sm outline-none focus:border-gold transition-colors">
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-black tracking-widest uppercase text-ink-400">Password</label>
        <input type="password" [(ngModel)]="loginData.password" name="password" required
               placeholder="••••••••"
               class="bg-ink-800 border border-ink-700 text-white placeholder-ink-500 px-4 py-3 text-sm outline-none focus:border-gold transition-colors">
      </div>
      <button type="submit" [disabled]="loading()" class="btn-primary w-full mt-2 disabled:opacity-50">
        {{ loading() ? 'Logging in...' : 'Login' }}
      </button>
      <p class="text-center text-ink-500 text-sm mt-2">
        No account?
        <button type="button" (click)="mode.set('register')" class="text-gold bg-transparent border-none cursor-pointer font-semibold">
          Register here
        </button>
      </p>
    </form>

    <!-- REGISTER FORM -->
    <form *ngIf="mode() === 'register'" (ngSubmit)="register()" class="flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black tracking-widest uppercase text-ink-400">First Name</label>
          <input type="text" [(ngModel)]="registerData.firstName" name="firstName" required
                 placeholder="John"
                 class="bg-ink-800 border border-ink-700 text-white placeholder-ink-500 px-4 py-3 text-sm outline-none focus:border-gold transition-colors">
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black tracking-widest uppercase text-ink-400">Last Name</label>
          <input type="text" [(ngModel)]="registerData.lastName" name="lastName" required
                 placeholder="Doe"
                 class="bg-ink-800 border border-ink-700 text-white placeholder-ink-500 px-4 py-3 text-sm outline-none focus:border-gold transition-colors">
        </div>
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-black tracking-widest uppercase text-ink-400">Email</label>
        <input type="email" [(ngModel)]="registerData.email" name="email" required
               placeholder="john@example.com"
               class="bg-ink-800 border border-ink-700 text-white placeholder-ink-500 px-4 py-3 text-sm outline-none focus:border-gold transition-colors">
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-black tracking-widest uppercase text-ink-400">Phone</label>
        <input type="text" [(ngModel)]="registerData.phone" name="phone"
               placeholder="+1234567890"
               class="bg-ink-800 border border-ink-700 text-white placeholder-ink-500 px-4 py-3 text-sm outline-none focus:border-gold transition-colors">
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-black tracking-widest uppercase text-ink-400">Password</label>
        <input type="password" [(ngModel)]="registerData.password" name="password" required
               placeholder="••••••••"
               class="bg-ink-800 border border-ink-700 text-white placeholder-ink-500 px-4 py-3 text-sm outline-none focus:border-gold transition-colors">
      </div>
      <button type="submit" [disabled]="loading()" class="btn-primary w-full mt-2 disabled:opacity-50">
        {{ loading() ? 'Creating account...' : 'Create Account' }}
      </button>
      <p class="text-center text-ink-500 text-sm mt-2">
        Already have an account?
        <button type="button" (click)="mode.set('login')" class="text-gold bg-transparent border-none cursor-pointer font-semibold">
          Login here
        </button>
      </p>
    </form>

  </div>
</div>
